services:
  mutatie-service:
    image: ghcr.io/brp-api/gebeurtenis-mutatie-service:latest
    container_name: mutatie-service
    depends_on:
      axon-server:
        condition: service_started
      postgres:
        condition: service_healthy
      gebeurtenissen:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - GEBEURTENIS_URL=http://gebeurtenissen:8080/personen/gebeurtenissen
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/rvig_haalcentraal_testdata
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - PROJECTIONS_DATASOURCE_URL=jdbc:postgresql://db:5432/rvig_brpapi_projecties
      - PROJECTIONS_DATASOURCE_USERNAME=root
      - PROJECTIONS_DATASOURCE_PASSWORD=root
      - AXON_SERVER_HOST=axon
    networks:
      - brp-api-network

networks:
  brp-api-network:
    name: brp-api-network
