openapi: 3.1.2
info: 
  title: verblijfplaats onderzoek gebeurtenissen specificatie
  version: 1.0.0
components:
  schemas:
    VerblijfplaatsOnderzoek:
      allOf: 
        - $ref: 'gebeurtenis-v1.yaml#/components/schemas/Gebeurtenis'
        - type: object
          required: 
            - data
          properties:
            data:
              $ref: '#/components/schemas/VerblijfplaatsOnderzoekData'

    VerblijfplaatsBeeindigdOnderzoek:
      allOf: 
        - $ref: 'gebeurtenis-v1.yaml#/components/schemas/Gebeurtenis'
        - type: object
          required: 
            - data
          properties:
            data:
              $ref: '#/components/schemas/VerblijfplaatsBeeindigdOnderzoekData'

    VerblijfplaatsOnderzoekData:
      type: object
      properties:
        c01:
          $ref: '../identificatienummers/anummer-v1.yaml#/components/schemas/AnummerIdentificatieNummers'
        c08:
          $ref: '#/components/schemas/DataVerblijfplaatsMetOnderzoek'
      required: 
        - c01
        - c08

    VerblijfplaatsBeeindigdOnderzoekData:
      type: object
      properties:
        c01:
          $ref: '../identificatienummers/anummer-v1.yaml#/components/schemas/AnummerIdentificatieNummers'
        c08:
          $ref: '#/components/schemas/DataVerblijfplaatsMetBeeindigdOnderzoek'
      required: 
        - c01
        - c08

    DataVerblijfplaatsMetOnderzoek:
      allOf:
        - $ref: './verhuisd-intergemeentelijk-v1.yaml#/components/schemas/AdresData'
        - type: object
          properties:       
            e8310: 
              $ref: '../onderzoek-v1.yaml#/components/schemas/AanduidingGegevensInOnderzoek'
            e8320:
              $ref: '../onderzoek-v1.yaml#/components/schemas/DatumIngangOnderzoek'
          required:
            - e8310
            - e8320

    DataVerblijfplaatsMetBeeindigdOnderzoek:
      allOf:
        - $ref: '#/components/schemas/DataVerblijfplaatsMetOnderzoek'
        - type: object
          properties:  
            e8330:
              $ref: '../onderzoek-v1.yaml#/components/schemas/DatumEindeOnderzoek'
          required:
            - e8330
