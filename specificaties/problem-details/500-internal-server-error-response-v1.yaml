openapi: 3.1.2
info:
  title: 500 Internal Server Error Response type definitie
  description: |
    Definitie voor Internal Server Error Response, voor het leveren van de 'onverwachte server fout' foutmelding 
  version: 1.0.0
  contact: {}
components:
  responses:
    '500':
      description: Internal Server Error
      headers:
        API-Version:
          $ref: '../headers/api-version-v1.yaml#/components/headers/ApiVersion'
      content:
        application/problem+json:
          schema:
            $ref: 'fout-bericht-v1.yaml#/components/schemas/Foutbericht'
          example:
            type: https://www.rfc-editor.org/rfc/rfc9110.html#name-500-internal-server-error
            title: Interne server fout.
            status: 500
            detail: The server encountered an unexpected condition which prevented it from fulfilling the request.
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: serverError
