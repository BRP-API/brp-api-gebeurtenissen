openapi: 3.1.2
info: 
  title: Zeg op abonnement op gebeurtenis type van persoon command definitie
  version: 1.0.0
components: 
  schemas:
    ZegOpAbonnementVanPersoonOpGroepCommand:
      allOf: 
        - $ref: './abonnementen-command-v1.yaml#/components/schemas/AbonnementenCommand'
        - type: object
          description: Beëindigen van een abonnement voor een persoon voor een groep.
          properties:
            groep:
              $ref: 'naam-v1.yaml#/components/schemas/GroepNaam'
              description: De groep waarop de abonnee de persoon wil abonneren
            burgerservicenummer:
              $ref: '../../brp/identificatienummers/burgerservicenummer-v1.yaml#/components/schemas/Burgerservicenummer'
          required:
            - groep
            - burgerservicenummer
