openapi: 3.1.2
info:
  title: Abonnement van een persoon op een groep type definitie
  version: 1.0.0
components:
  schemas:
    AbonnementVanPersoonOpGroep:
      allOf:
        - $ref: 'abonnement-v1.yaml#/components/schemas/Abonnement'
        - type: object
          properties:
            groep:
              $ref: 'naam-v1.yaml#/components/schemas/GroepNaam'
              description: De groep waarop de abonnee de persoon wil abonneren
            burgerservicenummer:
              $ref: '../../brp/identificatienummers/burgerservicenummer-v1.yaml#/components/schemas/Burgerservicenummer'
              description: Het burgerservicenummer (BSN) van de persoon waarvoor de abonnee gebeurtenissen van het opgegeven type ontvangt
          required:
          - id
          - groep
          - burgerservicenummer