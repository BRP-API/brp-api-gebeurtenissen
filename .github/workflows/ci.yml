name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".docker/**"
      - ".github/**"
      - "features/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      KC_BASE_URL: http://localhost:8080
      KC_MASTER_USERNAME: ${{ secrets.KC_MASTER_USERNAME }}
      KC_MASTER_PASSWORD: ${{ secrets.KC_MASTER_PASSWORD }}
      ABONNEMENT_BASE_URL: http://localhost:8888
      MUTATIE_BASE_URL: http://localhost:8000
      AXON_API_BASE_URL: http://localhost:8024
      GEBEURTENISSEN_BASE_URL: http://localhost:8002
      WIREMOCK_BASE_URL: http://localhost:8889

    permissions:
      contents: read
      actions: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint step definitions
        run: npm run lint

      - name: Lint feature files
        run: npm run gherkin-lint

      - name: Zet run permissions op script folder
        uses: ./.github/actions/zet-run-bash-scripts-permission
        with:
          path-bash-file-or-folder: ./scripts/*

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start all containers
        run: |
          ./scripts/containers-start.sh

      - name: Wait for gebeurtenissen API readiness
        run: |
          for i in {1..90}; do
            response=$(curl -s "http://localhost:8888/actuator/health/readiness" || true)

            if [ "$response" = '{"status":"UP"}' ]; then
              echo "Gebeurtenissen API is ready"
              exit 0
            fi

            echo "Gebeurtenissen API not ready yet (curl: $response)"
            sleep 2
          done

          echo "Gebeurtenissen API not ready in time" >&2
          docker ps
          docker logs gebeurtenissen || true
          exit 1
        shell: bash

      - name: Valideer functionele specs
        uses: ./.github/actions/valideer-functionele-specs

      - name: Upload test rapportage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Reports
          path: |
            test-reports
            test-data/logs

      - name: Stop containers
        if: always()
        run: |
          ./scripts/containers-stop.sh
