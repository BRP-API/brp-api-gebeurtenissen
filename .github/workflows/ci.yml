name: Continuous Integration

on:
  push:
    paths:
      - ".docker/**"
      - ".github/**"
      - "features/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      KC_BASE_URL: http://keycloak:8080
      KC_MASTER_USERNAME: ${{ secrets.KC_MASTER_USERNAME }}
      KC_MASTER_PASSWORD: ${{ secrets.KC_MASTER_PASSWORD }}
      ABONNEMENT_BASE_URL: http://localhost:8000
      MUTATIE_BASE_URL: http://localhost:8888
      AXON_API_BASE_URL: http://localhost:8024
      GEBEURTENISSEN_BASE_URL: http://localhost:8002

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zet run permissions op script folder
        uses: ./.github/actions/zet-run-bash-scripts-permission
        with:
          path-bash-file-or-folder: ./scripts/*

      - name: Voeg keycloak toe als host naam
        uses: ./.github/actions/toevoegen-localhost-naam
        with:
          host-name: keycloak

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start containers
        run: |
          ./scripts/containers-start.sh

      - name: Wait for Axon Server DB restart
        run: sleep 5s
        shell: bash

      - name: Start gebeurtenissen containers
        run: |
          ./scripts/containers-gebeurtenissen-start.sh

      - name: Valideer functionele specs
        uses: ./.github/actions/valideer-functionele-specs

      - name: Stop gebeurtenissen containers
        if: always()
        run: |
          ./scripts/containers-gebeurtenissen-stop.sh

      - name: Stop base containers
        if: always()
        run: |
          ./scripts/containers-stop.sh
