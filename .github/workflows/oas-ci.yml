name: OpenAPI Specification CI

on:
  push:
    branches:
      - "**"
    paths:
      - "specificaties/**"
      - ".github/workflows/oas-ci.yml"
      - "scripts/oas-*.sh"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zet run permissions op script folder
        uses: ./.github/actions/zet-run-bash-scripts-permission
        with:
          path-bash-file-or-folder: ./scripts/*

      - name: Lint OpenAPI specifications
        run: |
          ./scripts/oas-lint.sh

      - name: Resolve OpenAPI references
        run: |
          ./scripts/oas-resolve.sh

      - name: Lint resolved OpenAPI specifications
        run: |
          ./scripts/oas-lint-resolved.sh

      - name: Commit resolved OpenAPI specifications
        run: |
          if [[ -n $(git status specificaties/**/resolved/*.yaml --porcelain) ]]; then
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git add specificaties/**/resolved/*.yaml
            git pull --ff-only
            git commit -m "chore(oas): resolved OpenAPI specifications"
            git push
          fi
