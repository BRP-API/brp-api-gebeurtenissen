replicaCount: 1

image:
  repository: ghcr.io/brp-api/brp-api-gebeurtenissen
  tag: latest
  pullPolicy: Never

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

hostAliases: []

service:
  type: ClusterIP
  port: 8888
  targetPort: 8888

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: gebeurtenissen.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 40
  periodSeconds: 3
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 3
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Voor de onderstaande config wordt een ConfigMap gegenereerd
# die vervolgens aan de environment van de container wordt gekoppeld.
config:
  AXON_AXONSERVER_SERVERS: "axon"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://brpv-db:5432/rvig_haalcentraal_testdata"
  SPRING_DATASOURCE_USERNAME: "root"
  PROJECTIONS_DATASOURCE_URL: "jdbc:postgresql://projecties-db:5432/rvig_brpapi_projecties"
  PROJECTIONS_DATASOURCE_USERNAME: "root"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: "http://keycloak:8080/realms/brp-api"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: "http://keycloak:8080/realms/brp-api/protocol/openid-connect/certs"


# Het secret kan aan een bestaand secret worden gekoppeld dat 
# vervolgens aan de omgeving van de container wordt gekoppeld.
# In het secret staan alle gegevens die niet plain-text in 
# een git repo terecht mogen komen zoals:
#
# SPRING_DATASOURCE_PASSWORD: "root"
# PROJECTIONS_DATASOURCE_PASSWORD: "root"
#
secret:
  enabled: false
  existingSecretName: "gebeurtenissen"

