# Default values for axon-prod
# This is a YAML-formatted file.

# Singleton StatefulSet mode: each Helm install deploys exactly one Axon Server node.
replicaCount: 1

image:
  repository: axoniq/axonserver
  pullPolicy: IfNotPresent
  tag: "2026.0.0-nonroot"

global:
  secretConfig: {}
  config:
    # Cluster defaults (can be overridden via config/secretConfig).
    AXONIQ_AXONSERVER_STANDALONE: "false"
    AXONIQ_AXONSERVER_STANDALONE_DCB: "true"
    AXONIQ_AXONSERVER_AUTOCLUSTER_CONTEXTS: "_admin,default"
    AXONIQ_AXONSERVER_DEVMODE_ENABLED: "false"

singleton:
  # Axon node name for this release, e.g. axonserver-1.
  # If empty, the release fullname is used.
  nodeName: ""
  # First cluster node name, e.g. axonserver-1.
  # If empty, defaults to singleton.nodeName (or release fullname).
  firstNodeName: ""

config: {}
  # AXONIQ_AXONSERVER_INTERNAL_HOSTNAME: "axon-server-0.axon-server-grpc"

secretConfig: {}
  # AXONIQ_LICENSE: "..."

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 1000

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  gui:
    # ClusterIP service voor Axon Server dashboard / HTTP API
    type: ClusterIP
    port: 8024
    sessionAffinity: ClientIP
  grpc:
    # Headless service gebruikt als de StatefulSet service (gRPC)
    clientPort: 8124
    internalPort: 8224

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: axon-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /actuator/info
    port: http
  initialDelaySeconds: 60
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/info
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 6

persistence:
  data:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  events:
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

nodeSelector: {}
tolerations: []
affinity: {}

checksums:
  - name: config
    template: env-configmap.yaml
  - name: secret-config
    template: env-secret.yaml
